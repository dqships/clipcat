name: CI

on:
  pull_request:
  push:
    branches: [main]
    # A version tag (v0.2.0) also publishes a release, which the app updates from.
    tags: ["v*"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, test, tokens
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run lint:tokens
      - run: npm run build --workspace=@clipcat/ui
      # Builds the site and checks the served pages against the launch checklist.
      - run: npm run test:server --workspace=@clipcat/site

  package:
    name: Package and smoke test (${{ matrix.target }})
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          # The Swift and whisper builds still target macOS 14, so this runner doesn't raise what ClipCat needs.
          - os: macos-15
            target: darwin-arm64
            app: apps/desktop/out/ClipCat-darwin-arm64/ClipCat.app/Contents/MacOS/ClipCat
            ffmpeg: apps/desktop/out/ClipCat-darwin-arm64/ClipCat.app/Contents/Resources/bin/ffmpeg
            models: ~/clipcat-models
          # Intel Macs get their own build (not a universal one): Apple Silicon downloads stay half
          # the size, and each half is smoke tested on its own hardware.
          - os: macos-15-intel
            target: darwin-x64
            app: apps/desktop/out/ClipCat-darwin-x64/ClipCat.app/Contents/MacOS/ClipCat
            ffmpeg: apps/desktop/out/ClipCat-darwin-x64/ClipCat.app/Contents/Resources/bin/ffmpeg
            models: ~/clipcat-models
            # This runner's virtual machine has no GPU (no Metal, and SwiftShader fails there too), so
            # Chromium has no WebGL and MediaPipe's face detector can't start. Every Intel Mac that runs
            # macOS 14 has a Metal GPU. The detector is the same WebAssembly on every system and is
            # tested on the other runners; here the smoke test checks it fails only for want of WebGL.
            webgl: false
          - os: windows-latest
            target: win32-x64
            app: apps/desktop/out/ClipCat-win32-x64/ClipCat.exe
            ffmpeg: apps/desktop/out/ClipCat-win32-x64/resources/bin/ffmpeg.exe
            models: ~/clipcat-models
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      SKIP_SIGN: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: The tag matches the app's version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "apps/desktop/package.json says $version, the tag is $GITHUB_REF_NAME"; exit 1; }
      # Releases are signed and notarized when the Developer ID secrets are set (see README); without
      # them the build stays unsigned, which runs fine but can't install updates by itself on a Mac.
      - name: Import the Developer ID certificate
        if: startsWith(github.ref, 'refs/tags/v') && startsWith(matrix.target, 'darwin')
        env:
          MACOS_CERT_P12: ${{ secrets.MACOS_CERT_P12 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
        run: |
          if [ -z "$MACOS_CERT_P12" ]; then echo "No MACOS_CERT_P12 secret; this release is unsigned."; exit 0; fi
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$keychain_password" build.keychain
          echo "$MACOS_CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" build.keychain
          echo "SKIP_SIGN=" >> "$GITHUB_ENV"
      - run: npm run fetch:ffmpeg -- ${{ matrix.target }}
      - name: Cache the cutout model
        uses: actions/cache@v4
        with:
          path: vendor/models/isnet-small.onnx
          key: cutout-${{ hashFiles('scripts/fetch-cutout.mjs') }}
      - run: npm run fetch:cutout
      - name: Cache whisper-cli
        uses: actions/cache@v4
        with:
          path: vendor/bin/${{ matrix.target }}/whisper-cli*
          key: whisper-${{ matrix.target }}-${{ hashFiles('scripts/build-whisper.mjs') }}
      - run: npm run build:whisper
      # The Swift helpers (Parakeet on Apple Silicon, the recorder on both Macs) need Swift 6, so Xcode 16 or newer.
      - name: Select the newest Xcode
        if: startsWith(matrix.target, 'darwin')
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Cache clipcat-parakeet
        if: matrix.target == 'darwin-arm64'
        uses: actions/cache@v4
        with:
          path: vendor/bin/${{ matrix.target }}/clipcat-parakeet
          key: parakeet-${{ matrix.target }}-${{ hashFiles('native/parakeet/Package.swift', 'native/parakeet/Sources/**', 'scripts/build-parakeet.mjs') }}
      - run: npm run build:parakeet
      - name: clipcat-parakeet runs
        if: matrix.target == 'darwin-arm64'
        run: vendor/bin/${{ matrix.target }}/clipcat-parakeet --version
      - name: Cache clipcat-recorder
        if: startsWith(matrix.target, 'darwin')
        uses: actions/cache@v4
        with:
          path: vendor/bin/${{ matrix.target }}/clipcat-recorder
          key: recorder-${{ matrix.target }}-${{ hashFiles('native/recorder/Package.swift', 'native/recorder/Sources/**', 'scripts/build-recorder.mjs') }}
      - run: npm run build:recorder
      - name: clipcat-recorder runs
        if: startsWith(matrix.target, 'darwin')
        run: vendor/bin/${{ matrix.target }}/clipcat-recorder --version
      - name: Prep pipeline against the pinned ffmpeg
        run: npx vitest run src/pipeline
        working-directory: apps/desktop
        env:
          CLIPCAT_TEST_FFMPEG: ${{ github.workspace }}/vendor/bin/${{ matrix.target }}
      - run: npm run make
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      - name: The DMG window shows only ClipCat and Applications
        if: startsWith(matrix.target, 'darwin')
        run: |
          arch="${{ matrix.target }}"
          node scripts/check-dmg.mjs "apps/desktop/out/make/ClipCat-${arch#darwin-}.dmg"
      - name: The bundled tools are built for this Mac's processor
        if: startsWith(matrix.target, 'darwin')
        run: |
          want="$([ "${{ matrix.target }}" = darwin-arm64 ] && echo arm64 || echo x86_64)"
          for f in "$(dirname "${{ matrix.ffmpeg }}")"/* "${{ matrix.app }}"; do
            archs="$(lipo -archs "$f")"; echo "$(basename "$f"): $archs"
            test "$archs" = "$want"
            # Each runs on macOS 14, the oldest ClipCat supports.
            minos="$(vtool -show-build "$f" 2>/dev/null | awk '/minos/ {print $2; exit}')"
            [ -z "$minos" ] || [ "${minos%%.*}" -le 14 ] || { echo "$(basename "$f") needs macOS $minos"; exit 1; }
          done
      - name: The update manifest is where this build reads it
        if: startsWith(matrix.target, 'darwin')
        run: |
          arch="${{ matrix.target }}"; arch="${arch#darwin-}"
          name="$([ "$arch" = arm64 ] && echo RELEASES.json || echo "RELEASES-$arch.json")"
          file="$PWD/apps/desktop/out/make/zip/darwin/$arch/$name"
          cat "$file"; echo
          node -e '
            const [file, arch] = process.argv.slice(1);
            const m = require(file);
            const version = require("./apps/desktop/package.json").version;
            const current = m.releases.find((r) => r.version === m.currentRelease);
            if (m.currentRelease !== version) throw new Error(`currentRelease is ${m.currentRelease}, not ${version}`);
            if (!m.releases.every((r) => r.updateTo.url.includes(`-darwin-${arch}-`))) throw new Error("the manifest lists a zip for another processor");
            if (!current) throw new Error("no entry for currentRelease");' "$file" "$arch"
      - name: Bundled ffmpeg has libass
        run: |
          "${{ matrix.ffmpeg }}" -hide_banner -version | head -1
          "${{ matrix.ffmpeg }}" -hide_banner -filters | grep -E '^ ... (ass|subtitles) '
      - name: Smoke test the packaged app
        run: |
          out="$RUNNER_TEMP/smoke.json"
          CLIPCAT_SMOKE=1 CLIPCAT_SMOKE_OUT="$out" "${{ matrix.app }}" || code=$?
          cat "$out"; echo
          test "${code:-0}" = 0
          grep -q '"ok":true' "$out"
          grep -q '"screen":"library"' "$out"
          # The face detector (MediaPipe on WebAssembly) loads and runs inside the app; on a runner
          # without WebGL it loads and stops at its first WebGL call.
          if [ "${{ matrix.webgl }}" = false ]; then
            grep -q '"faceDetector":"Cannot read properties of undefined (reading .activeTexture.)"' "$out"
          else
            grep -q '"faceDetector":null' "$out"
          fi
          # So does the subject cutout (ISNet on ONNX Runtime's WebAssembly backend).
          grep -q '"cutout":null' "$out"
          # An outside agent reaches the MCP server through the packaged bridge.
          grep -q '"mcp":null' "$out"
      - name: Cache the speech models
        uses: actions/cache@v4
        with:
          path: ${{ matrix.models }}
          key: speech-models-${{ matrix.target }}-v2
      - name: Make a spoken test clip
        id: clip
        run: |
          dir="$RUNNER_TEMP/clip"; mkdir -p "$dir"
          one="The first take of this sentence goes wrong."
          two="This is the second take, and it is the one we keep."
          words=0
          if [ "$RUNNER_OS" = "macOS" ]; then
            ext=aiff
            say -o "$dir/one.$ext" "$one" && say -o "$dir/two.$ext" "$two" && words=1
          else
            ext=wav
            win="$(cygpath -w "$dir")"
            powershell -NoProfile -Command "
              Add-Type -AssemblyName System.Speech
              \$s = New-Object System.Speech.Synthesis.SpeechSynthesizer
              \$s.SetOutputToWaveFile('$win\one.wav'); \$s.Speak('$one')
              \$s.SetOutputToWaveFile('$win\two.wav'); \$s.Speak('$two'); \$s.Dispose()" && words=1 || true
          fi
          ff="${{ matrix.ffmpeg }}"
          # A face to find (NASA's portrait of Eileen Collins, public domain), or a test pattern if it can't be fetched.
          face=0
          if curl -fsSL --retry 3 -o "$dir/face.png" https://raw.githubusercontent.com/scikit-image/scikit-image/v0.24.0/skimage/data/astronaut.png; then
            "$ff" -hide_banner -y -loop 1 -framerate 30 -i "$dir/face.png" -t 12 \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,format=yuv420p" \
              -c:v libx264 "$dir/picture.mp4" && face=1
          fi
          [ "$face" = 1 ] || "$ff" -hide_banner -y -f lavfi -i testsrc2=s=1280x720:r=30:d=12 -c:v libx264 -pix_fmt yuv420p "$dir/picture.mp4"
          if [ "$words" = 1 ]; then
            "$ff" -hide_banner -y -i "$dir/one.$ext" -f lavfi -t 2.5 -i anullsrc=r=48000:cl=mono -i "$dir/two.$ext" \
              -i "$dir/picture.mp4" \
              -filter_complex "[0:a]aresample=48000,aformat=channel_layouts=mono[a0];[2:a]aresample=48000,aformat=channel_layouts=mono[a2];[a0][1:a][a2]concat=n=3:v=0:a=1[a]" \
              -map 3:v -map "[a]" -shortest -c:v libx264 -pix_fmt yuv420p -c:a aac "$dir/clip.mp4"
          else
            echo "No text-to-speech voice here; importing a clip without speech."
            "$ff" -hide_banner -y -t 6 -i "$dir/picture.mp4" -f lavfi -i sine=f=220:d=6 \
              -c:v libx264 -pix_fmt yuv420p -c:a aac "$dir/clip.mp4"
          fi
          echo "file=$dir/clip.mp4" >> "$GITHUB_OUTPUT"
          echo "words=$words" >> "$GITHUB_OUTPUT"
          echo "face=$face" >> "$GITHUB_OUTPUT"
      - name: Import, transcribe, find pauses and the face, and export in the packaged app
        run: |
          out="$RUNNER_TEMP/smoke-import.json"
          mkdir -p ${{ matrix.models }}
          CLIPCAT_SMOKE=1 CLIPCAT_SMOKE_OUT="$out" CLIPCAT_SMOKE_IMPORT="${{ steps.clip.outputs.file }}" \
            CLIPCAT_SMOKE_EXPECT_WORDS="${{ steps.clip.outputs.words }}" CLIPCAT_MODEL=base \
            CLIPCAT_MODELS_DIR="$(cd ${{ matrix.models }} && pwd -W 2>/dev/null || pwd)" "${{ matrix.app }}" || code=$?
          cat "$out"; echo
          # The speech engine's raw output and the project log, for when the transcript looks wrong.
          data="$HOME/Library/Application Support/ClipCat"; [ "$RUNNER_OS" = "Windows" ] && data="$APPDATA/ClipCat"
          find "$data/projects" \( -name 'transcript*.json' -o -name events.jsonl \) -exec cat {} \; | head -c 6000 || true; echo
          test "${code:-0}" = 0
          grep -q '"ok":true' "$out"
          # The face was found in the sampled frames.
          if [ "${{ steps.clip.outputs.face }}" = 1 ] && [ "${{ matrix.webgl }}" != false ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).import;
              if (!(r.faces > 0)) { console.error(`no face found (faces: ${r.faces})`); process.exit(1); }' "$out"
          fi
          # Both sentences, from the start, with the pause between them found.
          if [ "${{ steps.clip.outputs.words }}" = 1 ]; then
            node -e '
              const r = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8")).import;
              const bad = [];
              if (!/first take/i.test(r.text) || !/second take/i.test(r.text)) bad.push("a sentence is missing");
              if (!r.span || r.span[0] > 1) bad.push("the transcript does not start with the first sentence");
              if (!r.pauses.some(([a, b]) => b - a > 1.5)) bad.push("the pause between the sentences was not found");
              if (!(r.exported > 100000)) bad.push("the 9:16 export is missing or empty");
              const engine = process.argv[2] === "darwin-arm64" ? "parakeet" : "whisper.cpp";
              if (!r.backends.every((b) => b === engine)) bad.push(`heard by ${r.backends.join(", ")}, not ${engine}`);
              if (bad.length) { console.error(bad.join("; ")); process.exit(1); }' "$out" "${{ matrix.target }}"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ClipCat-${{ matrix.target }}
          # Installers, plus what the updater reads: RELEASES.json (RELEASES-x64.json on Intel) and the zip
          # on a Mac, RELEASES and the nupkg on Windows.
          path: |
            apps/desktop/out/make/**/*.dmg
            apps/desktop/out/make/**/*.zip
            apps/desktop/out/make/**/RELEASES*.json
            apps/desktop/out/make/squirrel.windows/**/*.exe
            apps/desktop/out/make/squirrel.windows/**/RELEASES
            apps/desktop/out/make/squirrel.windows/**/*.nupkg
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: release-notes
      - uses: actions/download-artifact@v4
        with:
          path: built
          merge-multiple: true
      - name: List what is published
        run: find built -type f -exec ls -l {} +
      # release-notes/<tag>.md, when there is one, goes above GitHub's list of PRs.
      - name: Find the release notes
        id: notes
        run: |
          f="release-notes/${GITHUB_REF_NAME}.md"
          if [ -f "$f" ]; then echo "path=$f" >> "$GITHUB_OUTPUT"; else echo "No $f; using GitHub's list only."; fi
      - uses: softprops/action-gh-release@v2
        with:
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            built/**/*.dmg
            built/**/*.zip
            built/**/RELEASES*.json
            built/**/*.exe
            built/**/RELEASES
            built/**/*.nupkg
